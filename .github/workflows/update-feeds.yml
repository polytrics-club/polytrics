name: Update news feeds
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-feeds.mjs
      - name: Commit if changed
        run: |
          git config user.name "polytrics-bot"
          git config user.email "polytrics-bot@users.noreply.github.com"
          git add data/feeds.json
          git diff --cached --quiet || (git commit -m "Refresh news feeds" && git push)
